---
.template:gitlab-api:env:get-url:branch:
  artifacts:
    reports:
      dotenv: url.env
  variables:
    GITLAB_API_TOKEN: $WEB_DEV_DEVELOPER_ACCESS_TOKEN
    BRANCH_URL_SRC: $CI_COMMIT_REF_NAME
    PROJECT_URL_SRC: ""
    URL_TYPE: "internal"  # support internal(http://), service(k8s), domain, other or null(full url)
  image:
    name: europe-west1-docker.pkg.dev/digital-staging/mdm-docker-registry/bases/ci-tools:sdk-devops
    pull_policy: always
  before_script:
    - |
      function get_url(){
        local project_url_src=$1
        local branch_url_src=$2
        [ -z "$project_url_src" ]&& echo "Error project_url_src is empty" && exit 1

        # Get Project ID, if multiple project id found, please use gitlab namespace
        project_id="$(curl --silent \
                      --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
                      "https://git.maisonsdumonde.net/api/v4/projects?search=${project_url_src}&search_namespaces=true" | jq -r ".[] | .id")"
        [ -z "$project_id" ]&& echo "Project $project_url_src not found" && exit 1
        [ $(echo $project_id | wc -w) -ne 1 ]&& echo "Error, project $project_url_src fount ids $project_id in gitlab" && exit 1

        # Get env url
        env_url="$(curl --silent \
                      --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
                      "https://git.maisonsdumonde.net/api/v4/projects/$project_id/environments?name=review/$branch_url_src&states=available" \
                      | jq -r --arg environment_name "review/$branch_url_src" '.[] | select(.name == $environment_name) | .external_url' || echo "")"
        # Api can reply null, change to empty string
        [ "$env_url" == "null" ]&& env_url=""

        if [ -n "$env_url" ]
        then
          case "$URL_TYPE" in
            # Change to http url for local call, rm
            "internal")
              env_url="$(echo "$env_url" | sed -E 's/^https/http/;s@([^/:])/.*$@\1@')"
              ;;
             # Change to internal service url for direct call (ex for istio vs)
            "service")
              #get project ns via project name without any gitlab namespace
              project_kube_ns="$(echo "$project_url_src" | awk -F'/' '{print $NF}')"
              env_url="$(echo "$env_url" | awk -F'.' -v ns=$project_kube_ns '{ print $1"."ns".svc.cluster.local" }')"
              ;;
            # get only domain
            "domain")
              env_url="$(echo "$env_url" | sed -E 's@^http[s]*://@@;s@/.*$@@')"
              ;;
          esac

          echo "Url found for $project_url_src = $env_url"
        fi
      }
  script:
    - get_url "$PROJECT_URL_SRC" "$BRANCH_URL_SRC"
    - echo "${project_url_src}=${env_url}" > url.env

.template:gitlab-api:env:get-urls:branches:
  extends: .template:gitlab-api:env:get-url:branch
  variables:
    PROJECTS_URL_SRC: ""
    BRANCHES_URL_SRC: |
       $CI_COMMIT_REF_NAME
       $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  script:
    - |
      if [ -z "$urls_list" ]; then
        declare -A urls_list
      fi
    - |
      for PROJECT_URL_SRC in $PROJECTS_URL_SRC
      do
        for BRANCH_URL_SRC in $BRANCHES_URL_SRC
        do
          if [ -z "${urls_list[$PROJECT_URL_SRC]}" ]
          then
            get_url "$PROJECT_URL_SRC" "$BRANCH_URL_SRC"
            urls_list[$PROJECT_URL_SRC]="$env_url"
          fi
        done
      done
