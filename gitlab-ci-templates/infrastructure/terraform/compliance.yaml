---

.template:terraform:compliance:fmt:
  image:
    name: europe-west1-docker.pkg.dev/digital-staging/mdm-docker-registry/bases/ci-tools:terraform-terragrunt
    pull_policy: always
  variables:
    TF_ROOT_FILE_PATH: ""
  script:
    - |
      code=0
      for file in $(terraform fmt -check -recursive ${TF_ROOT_FILE_PATH:-./}); do
        echo "Please run: terraform fmt ${file}"
        code=1
      done
      exit $code

.template:terraform:compliance:lint:
  image: ghcr.io/terraform-linters/tflint-bundle:v0.41.0.0
  variables:
    TERRAFORM_MODULE_DIR: "."  # The path to your Terraform module
    TFLINT_LOG: info
  before_script:
    - |
      cat << EOF > ${TERRAFORM_MODULE_DIR}/.tflint.hcl
      plugin "google" {
          enabled = true
      }
      EOF
  script:
    - |
      cd ${TERRAFORM_MODULE_DIR}
      tflint --init
      tflint --config=${TERRAFORM_MODULE_DIR}/.tflint.hcl

.template:terraform:compliance:test:
  image:
    name: europe-west1-docker.pkg.dev/digital-staging/mdm-docker-registry/bases/ci-tools:terraform-terragrunt
    pull_policy: always
  script:
    - terraform -version
    - terraform test

.template:terraform:compliance:best-practices:
  image:
    name: europe-west1-docker.pkg.dev/digital-staging/mdm-docker-registry/bases/ci-tools:terraform-terragrunt
    pull_policy: always
  variables:
    TF_ROOT_FILE_PATH: ""
  script:
    - |
      code=0
      for file in $(find ${TF_ROOT_FILE_PATH:-./} -not -path '*/\.*' -iname "*.tf"); do
          awk -v file="$file" '
                $1 == "resource" ||
                $1 == "module" ||
                $1 == "variable" ||
                $1 == "data" {
                  if ($3 ~/[A-Z]/) {
                      c = 1;
                      print file ": the " $1 " " $3 " must be downcased"}
                  if ($3 ~/-/) {
                      c = 1;
                      print file ": the " $1 " " $3 " must be underscored"}
                }
              END {exit c}' "$file" || code=1
      done
      exit $code

.template:terraform:compliance:validate:
  image:
    name: europe-west1-docker.pkg.dev/digital-staging/mdm-docker-registry/bases/ci-tools:terraform-terragrunt
    pull_policy: always
  variables:
    TF_IN_AUTOMATION: "true"
    GOOGLE_APPLICATION_CREDENTIALS: /tmp/key.json
    TF_ROOT_FILE_PATH: "."
  script:
    - |
       cat <<-EOF > ~/.terraformrc
       credentials "git.maisonsdumonde.net" {
         token = "${CI_JOB_TOKEN}"
       }
       EOF
    - |
      # Replace all occurences of ssh://git@git.maisonsdumonde.net by
      # https://gitlab-ci-token:TOKEN@git.maisonsdumonde.net
      # Note that the token has the rights
      # of the user/developer initiating the job/pipeline action.
      find . -maxdepth 1 -name "*.tf" -print0 \
        | xargs -0 -n1 -I {} \
          sed -i "s/ssh:\/\/git@git.maisonsdumonde.net/\
          https:\/\/gitlab-ci-token:${CI_JOB_TOKEN}@git.maisonsdumonde.net/" {}
    - |
      echo "$TERRAFORM_GCP_SA_KEY" > /tmp/key.json
      gcloud auth activate-service-account --key-file /tmp/key.json
    - cd $TF_ROOT_FILE_PATH
    - terraform -version
    - terraform init > /dev/null
    - terraform validate
